[workspace]
resolver = "3"
members = [
    "crates/pistis-assurance",
    "crates/pistis-authentication",
    "crates/pistis-canonical",
    "crates/pistis-crypto",
    "crates/pistis-device-registry",
    "crates/pistis-discovery",
    "crates/pistis-domain",
    "crates/pistis-github",
    "crates/pistis-google",
    "crates/pistis-identity",
    "crates/pistis-monas",
    "crates/pistis-protocol",
    "crates/pistis-qr",
    "crates/pistis-recovery",
    "crates/pistis-release",
    "crates/pistis-synoptikon",
    "crates/pistis-verifier",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"
repository = "https://github.com/sagrudd/pistis"

[workspace.dependencies]
base64 = "0.22.1"
getrandom = "0.3.3"
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
mdns-sd = "=0.20.2"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "sha256"] }
pistis-assurance = { version = "0.1.0", path = "crates/pistis-assurance" }
pistis-authentication = { version = "0.1.0", path = "crates/pistis-authentication" }
pistis-canonical = { version = "0.1.0", path = "crates/pistis-canonical" }
pistis-crypto = { version = "0.1.0", path = "crates/pistis-crypto" }
pistis-device-registry = { version = "0.1.0", path = "crates/pistis-device-registry" }
pistis-discovery = { version = "0.1.0", path = "crates/pistis-discovery" }
pistis-domain = { version = "0.1.0", path = "crates/pistis-domain" }
pistis-github = { version = "0.1.0", path = "crates/pistis-github" }
pistis-google = { version = "0.1.0", path = "crates/pistis-google" }
pistis-identity = { version = "0.1.0", path = "crates/pistis-identity" }
pistis-monas = { version = "0.1.0", path = "crates/pistis-monas" }
pistis-protocol = { version = "0.1.0", path = "crates/pistis-protocol" }
pistis-qr = { version = "0.1.0", path = "crates/pistis-qr" }
pistis-recovery = { version = "0.1.0", path = "crates/pistis-recovery" }
pistis-release = { version = "0.1.0", path = "crates/pistis-release" }
pistis-synoptikon = { version = "0.1.0", path = "crates/pistis-synoptikon" }
qrcode = { version = "0.14.1", default-features = false }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = "1.0.228"
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"
url = "2.5.7"
zeroize = "1.8.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
