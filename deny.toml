[advisories]
version = 2
ignore = []
unmaintained = "all"
yanked = "deny"

[bans]
multiple-versions = "warn"
multiple-versions-include-dev = true
wildcards = "deny"

[licenses]
include-dev = true
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "NCSA",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
ignore = false

[sources]
unknown-git = "deny"
unknown-registry = "deny"
required-git-spec = "rev"
allow-git = ["https://github.com/sagrudd/thesaurophylax.git"]
