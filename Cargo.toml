[workspace]
resolver = "3"
members = [
    "crates/pistis-canonical",
    "crates/pistis-crypto",
    "crates/pistis-domain",
    "crates/pistis-protocol",
    "crates/pistis-verifier",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"
repository = "https://github.com/sagrudd/pistis"

[workspace.dependencies]
getrandom = "0.3.3"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "sha256"] }
pistis-canonical = { version = "0.1.0", path = "crates/pistis-canonical" }
pistis-crypto = { version = "0.1.0", path = "crates/pistis-crypto" }
pistis-domain = { version = "0.1.0", path = "crates/pistis-domain" }
pistis-protocol = { version = "0.1.0", path = "crates/pistis-protocol" }
serde = "1.0.228"
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
